# Tiny Tapeout project information
project:
  title:        "AES-128 Core"
  author:       "Chung Hon Ting"
  discord:      ""
  description:  "Area-optimized byte-serial AES-128 encryption core: one shared Canright S-box, 297 cycles/op, serial I/O in a 1x2 tile"
  language:     "Verilog"
  clock_hz:     50000000

  tiles: "1x2"

  top_module:  "tt_um_haydencoder_aes128"

  source_files:
    - "project.v"
    - "sbox.v"
    - "key_expansion.v"
    - "shift_rows.v"
    - "mix_columns.v"
    - "aes_core.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs (ui_in[7:0])
  ui[0]: "DATA_IN[0]"
  ui[1]: "DATA_IN[1]"
  ui[2]: "DATA_IN[2]"
  ui[3]: "DATA_IN[3]"
  ui[4]: "DATA_IN[4]"
  ui[5]: "DATA_IN[5]"
  ui[6]: "DATA_IN[6]"
  ui[7]: "DATA_IN[7]"

  # Outputs (uo_out[7:0])
  uo[0]: "DATA_OUT[0]"
  uo[1]: "DATA_OUT[1]"
  uo[2]: "DATA_OUT[2]"
  uo[3]: "DATA_OUT[3]"
  uo[4]: "DATA_OUT[4]"
  uo[5]: "DATA_OUT[5]"
  uo[6]: "DATA_OUT[6]"
  uo[7]: "DATA_OUT[7]"

  # Bidirectional pins (uio_in/out[7:0])
  uio[0]: "START"
  uio[1]: ""               # unused
  uio[2]: ""               # unused
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: "BUSY"          # 1=processing
  uio[7]: "DATA_VALID"    # 1=output byte valid

# Do not change!
yaml_version: 6